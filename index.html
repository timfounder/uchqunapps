/** Convert an IAU pole direction (equatorial RA/Dec, degrees) to a unit
 *  vector in scene coordinates (X = vernal equinox, Y = ecliptic north). */
function poleDirectionScene(raDeg, decDeg) {
  const ra = raDeg * Math.PI / 180;
  const dec = decDeg * Math.PI / 180;
  const xEq = Math.cos(dec) * Math.cos(ra);
  const zEq = Math.cos(dec) * Math.sin(ra);
  const yEq = Math.sin(dec);
  const eps = 23.4392911 * Math.PI / 180;
  const ce = Math.cos(eps), se = Math.sin(eps);
  return new THREE.Vector3(xEq, ce * yEq + se * zEq, se * yEq - ce * zEq).normalize();
}

const _yAxis = new THREE.Vector3(0, 1, 0);

function makeBodyVisual(body) {
  const group = new THREE.Group();
  const radius = getBodyVisualRadius(body);
  // Sphere subdivision — only used by the non-spacecraft path and by the
  // shared post-mesh code below (clouds, atmosphere), so hoist it up.
  const segments = body.kind === 'star' ? 96 : (radius > 0.3 ? 64 : 32);
  // Per-body sun-direction uniform, shared by the surface, cloud-shadow and
  // atmosphere shaders of this body. (A single global uniform meant the last
  // body processed each frame set the light direction for ALL bodies.)
  const sunUni = { value: new THREE.Vector3(1, 0, 0) };

  // Axis carrier: oriented along the body's real rotation axis (IAU pole
  // where known, plain axial tilt otherwise). The mesh inside it then spins
  // purely around its local Y, so the spin axis stays fixed in space instead
  // of precessing around the world vertical.
  const axisGroup = new THREE.Group();
  if (body.poleRA !== undefined && body.poleDec !== undefined) {
    axisGroup.quaternion.setFromUnitVectors(_yAxis, poleDirectionScene(body.poleRA, body.poleDec));
  } else if (body.axialTilt) {
    axisGroup.rotation.z = body.axialTilt * Math.PI / 180;
  }
  group.add(axisGroup);

  let mesh;
  if (body.kind === 'spacecraft') {
    // Procedural 3D model — recognizable silhouette of the real spacecraft.
    mesh = makeSpacecraftMesh(body, radius);
    mesh.userData.bodyId = body.id;
    group.add(mesh);
  } else {
    const geom = new THREE.SphereGeometry(radius, segments, segments);
    const mat = materialForBody(body, sunUni);
    mesh = new THREE.Mesh(geom, mat);
    mesh.userData.bodyId = body.id;
    axisGroup.add(mesh);
  }

  // Earth cloud layer — inside the axis group so it shares the tilt.
  if (body.id === 'earth') {
    const cloudGeo = new THREE.SphereGeometry(radius * 1.012, segments, segments);
    const cloudMat = cloudsMaterial();
    const clouds = new THREE.Mesh(cloudGeo, cloudMat);
    clouds.userData.isClouds = true;
    axisGroup.add(clouds);
  }

  // Atmosphere halo.
  const atmoMap = {
    earth: { color: '#7ab8ff', intensity: 0.9, scale: 1.04 },
    venus: { color: '#f5e0a8', intensity: 1.2, scale: 1.06 },
    mars:  { color: '#ffb090', intensity: 0.5, scale: 1.03 },
    jupiter: { color: '#f0d4a0', intensity: 0.8, scale: 1.04 },
    saturn:  { color: '#e8d4a2', intensity: 0.6, scale: 1.03 },
    uranus:  { color: '#a0e8e0', intensity: 0.6, scale: 1.03 },
    neptune: { color: '#5a8fd8', intensity: 0.7, scale: 1.03 },
    titan:   { color: '#ffc070', intensity: 0.9, scale: 1.08 },
  };
  if (atmoMap[body.id]) {
    const a = atmoMap[body.id];
    const atmoGeo = new THREE.SphereGeometry(radius * a.scale, segments, segments);
    // Pass the body's sun uniform: the halo hugs the lit hemisphere and
    // reddens on the terminator instead of glowing uniformly.
    const atmoMat = atmosphereMaterial(a.color, a.intensity, sunUni);
    group.add(new THREE.Mesh(atmoGeo, atmoMat));
  }

  // Rings — use real ring textures with alpha + shader-based shadow of the planet.
  if (body.rings) {
    const innerR = radius * body.rings.innerScale;
    const outerR = radius * body.rings.outerScale;
    const ringTex = getTexture(body.rings.textureKey);
    const ringGeo = makeRingGeometry(innerR, outerR, 128);
    const ringMat = new THREE.ShaderMaterial({
      uniforms: {
        uMap: { value: ringTex },
        uPlanetRadius: { value: radius },
        // Sun direction in *ring local space*. We update it per frame.
        uSunLocal: { value: new THREE.Vector3(1, 0, 0) },
      },
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vLocalPos;
        #include <common>
  #include <logdepthbuf_pars_vertex>
        void main() {
          vUv = uv;
          vLocalPos = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          #include <logdepthbuf_vertex>
        }`,
      fragmentShader: `
        varying vec2 vUv;
        varying vec3 vLocalPos;
        uniform sampler2D uMap;
        uniform float uPlanetRadius;
        uniform vec3 uSunLocal;
        #include <logdepthbuf_pars_fragment>
        void main() {
          #include <logdepthbuf_fragment>
          vec4 col = texture2D(uMap, vUv);
          if (col.a < 0.05) discard;
          // Cast a ray from this ring point toward the sun (in local frame).
          // The planet is a sphere of radius uPlanetRadius at the origin.
          // Soft penumbra: shade by how close the ray passes to the sphere.
          vec3 dir = normalize(uSunLocal);
          vec3 origin = vLocalPos;
          float along = -dot(origin, dir);   // distance to closest approach, toward sun
          float shadow = 1.0;
          if (along > 0.0) {
            float dmin = sqrt(max(dot(origin, origin) - along * along, 0.0));
            float pen = uPlanetRadius * 0.08;
            shadow = mix(0.32, 1.0, smoothstep(uPlanetRadius - pen, uPlanetRadius + pen, dmin));
          }
          gl_FragColor = vec4(col.rgb * shadow, col.a);
        }`,
      side: THREE.DoubleSide,
      transparent: true,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    // The axis group already carries the planet's real tilt, so the ring
    // only needs to lie in the equatorial plane.
    ring.rotation.x = Math.PI / 2;
    ring.userData.isRing = true;
    ring.userData.ownerBodyId = body.id;
    axisGroup.add(ring);
  }

  // Sun corona — two glowing layers
  if (body.id === 'sun') {
    const c1Geo = new THREE.SphereGeometry(radius * 1.25, 32, 32);
    const c1Mat = atmosphereMaterial('#ffaa40', 1.4);
    group.add(new THREE.Mesh(c1Geo, c1Mat));
    const c2Geo = new THREE.SphereGeometry(radius * 1.8, 32, 32);
    const c2Mat = atmosphereMaterial('#ff6010', 0.7);
    group.add(new THREE.Mesh(c2Geo, c2Mat));
  }

  // Comet tail — two components, both pointing anti-sunward (oriented and
  // scaled per frame in animate() from the comet's heliocentric distance):
  // a straight bluish ion tail and a wider, curved, yellowish dust tail.
  if (body.kind === 'comet') {
    group.add(makeCometTail('ion'));
    group.add(makeCometTail('dust'));
    // Coma — the glowing gas envelope around the nucleus near perihelion.
    const comaMat = new THREE.SpriteMaterial({
      map: getSpotterTexture(body.visual.color),
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      opacity: 0.0,
    });
    const coma = new THREE.Sprite(comaMat);
    coma.scale.set(radius * 6, radius * 6, 1);
    coma.userData.isComa = true;
    group.add(coma);
  }

  const label = makeLabel(bodyText(body, 'name'));
  label.position.y = radius + 0.4;
  group.add(label);

  scene.add(group);
  bodyObjects.set(body.id, { group, mesh, label, radius, baseRadius: radius, sunUni, body });
}

/** Build one comet tail component as a particle cloud along local +Z.
 *  The +Z axis is pointed away from the Sun every frame; tail length and
 *  brightness follow the comet's distance from the Sun via uStrength. */
function makeCometTail(kind) {
  const N = 160;
  const isDust = kind === 'dust';
  const positions = new Float32Array(N * 3);
  const sizes = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const f = i / N;
    const spread = (isDust ? 0.10 : 0.05) + f * (isDust ? 0.8 : 0.3);
    // Dust grains lag the nucleus and bow away from the anti-sun line;
    // the ion tail stays straight and narrow.
    positions[i * 3]     = (Math.random() - 0.5) * spread + (isDust ? f * f * 1.8 : 0);
    positions[i * 3 + 1] = (Math.random() - 0.5) * spread;
    positions[i * 3 + 2] = f * 9.0 + Math.random() * 0.2;
    sizes[i] = (1 - f) * (isDust ? 0.22 : 0.15);
  }
  const tailGeo = new THREE.BufferGeometry();
  tailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  tailGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
  const color = isDust ? '1.0, 0.88, 0.66' : '0.55, 0.8, 1.0';
  const tailMat = new THREE.ShaderMaterial({
    uniforms: { uStrength: { value: 1 } },
    vertexShader: `
      attribute float size;
      varying float vAlpha;
      uniform float uStrength;
      #include <common>
  #include <logdepthbuf_pars_vertex>
      void main() {
        vAlpha = size * uStrength;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        // Cap the sprite size: without the clamp the additive particles
        // blow up into a full-screen wash when the camera enters the tail.
        gl_PointSize = clamp(size * 160.0 / -mv.z, 0.0, 18.0);
        gl_Position = projectionMatrix * mv;
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: `
      varying float vAlpha;
      #include <logdepthbuf_pars_fragment>
      void main() {
        #include <logdepthbuf_fragment>
        vec2 c = gl_PointCoord - 0.5;
        float d = length(c);
        if (d > 0.5) discard;
        float a = (1.0 - d * 2.0) * vAlpha;
        gl_FragColor = vec4(${color}, a * 0.85);
      }`,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  const tail = new THREE.Points(tailGeo, tailMat);
  tail.userData.isTail = true;
  return tail;
}

/** Current heliocentric distance of a Kepler-orbit body, in AU. */
function currentHelioAU(body, simMs) {
  if (!body.orbitAU || !body.yearYears) return body.orbitAU || 0;
  const daysSinceEpoch = (simMs - J2000_MS) / 86400000;
  const yearDays = body.yearYears * 365.25;
  let M = (body.meanAnomalyAtEpoch * Math.PI / 180) + (2 * Math.PI / yearDays) * daysSinceEpoch;
  M = ((M % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  const E = solveKepler(M, body.eccentricity);
  return body.orbitAU * (1 - body.eccentricity * Math.cos(E));
}

/** Build a ring geometry with proper UVs (radial). */
function makeRingGeometry(innerR, outerR, segments) {
  const geo = new THREE.RingGeometry(innerR, outerR, segments, 1);
  // Replace UVs so that u goes from 0 (inner) to 1 (outer) and v stays at 0.5
  const pos = geo.attributes.position;
  const uv = geo.attributes.uv;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const r = Math.sqrt(x*x + y*y);
    const t = (r - innerR) / (outerR - innerR);
    uv.setXY(i, t, 0.5);
  }
  uv.needsUpdate = true;
  return geo;
}

function makeLabel(text) {
  const canvas = document.createElement('canvas');
  const dpr = 2;
  canvas.width = 256 * dpr; canvas.height = 64 * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.font = '500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3;
  ctx.strokeText(text, 128, 32);
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText(text, 128, 32);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: true, opacity: 0.8 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(2.2, 0.55, 1);
  sprite.userData.isLabel = true;
  return sprite;
}

// ---------- Orbit lines ----------
const orbitLines = [];
const ORBIT_SEG = 192;

/** Write the orbit points for `body` into a positions Float32Array.
 *  The ellipse is computed in real AU and each point's distance is then
 *  remapped through orbitRadiusFromAU — exactly how getBodyPosition places
 *  the body itself, so the marker never drifts off its line. */
function fillOrbitPositions(arr, body) {
  const e = body.eccentricity;
  const a = body.orbitAU;
  const b = a * Math.sqrt(1 - e * e);
  const Omega = body.longitudeOfAscendingNode * Math.PI / 180;
  const i = body.inclinationDeg * Math.PI / 180;
  const omega = body.argumentOfPeriapsis * Math.PI / 180;
  const cosO = Math.cos(Omega), sinO = Math.sin(Omega);
  const cosI = Math.cos(i), sinI = Math.sin(i);
  const cosW = Math.cos(omega), sinW = Math.sin(omega);
  for (let k = 0; k <= ORBIT_SEG; k++) {
    const E = (k / ORBIT_SEG) * Math.PI * 2;
    const xOrb = a * (Math.cos(E) - e);
    const yOrb = b * Math.sin(E);
    const x = (cosO * cosW - sinO * sinW * cosI) * xOrb + (-cosO * sinW - sinO * cosW * cosI) * yOrb;
    const y = (sinW * sinI) * xOrb + (cosW * sinI) * yOrb;
    const z = (sinO * cosW + cosO * sinW * cosI) * xOrb + (-sinO * sinW + cosO * cosW * cosI) * yOrb;
    const rAU = Math.sqrt(x * x + y * y + z * z);
    const s = rAU > 1e-9 ? orbitRadiusFromAU(rAU) / rAU : 0;
    arr[k * 3]     = x * s;
    arr[k * 3 + 1] = y * s;
    arr[k * 3 + 2] = z * s;
  }
}

function rebuildOrbitLines() {
  for (const o of orbitLines) { scene.remove(o); o.geometry.dispose(); o.material.dispose(); }
  orbitLines.length = 0;
  for (const body of BODIES) {
    if (body.orbitAU === 0) continue;
    if (body.parentId !== 'sun') continue;
    const positions = new Float32Array((ORBIT_SEG + 1) * 3);
    fillOrbitPositions(positions, body);
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.LineBasicMaterial({
      color: body.visual.color, transparent: true, opacity: 0.08,
    });
    const line = new THREE.Line(geom, mat);
    line.renderOrder = -1;  // draw before bodies
    line.userData.bodyId = body.id;
    line.userData.bodyRef = body;
    line.visible = !(isOuterBody(body) && !state.showOuter);
    scene.add(line);
    orbitLines.push(line);
  }
  // Re-apply highlight if we currently have a selection.
  if (state.selectedId) highlightOrbit(state.selectedId);
}

/** Re-project existing orbit lines in place — used by the scale morph. */
function updateOrbitLineGeometries() {
  for (const line of orbitLines) {
    const attr = line.geometry.attributes.position;
    fillOrbitPositions(attr.array, line.userData.bodyRef);
    attr.needsUpdate = true;
    line.geometry.computeBoundingSphere();
  }
}

for (const body of BODIES) makeBodyVisual(body);
rebuildOrbitLines();

// ---------- Asteroid belt & Kuiper belt ----------
// Particle clouds on statistically plausible orbits. Particle data is kept
// in AU so positions re-project through the same scale blend as planets.
const BELTS = [];
const _beltProxy = { orbitAU: 1, parentId: null };

function makeBelt({ count, auMin, auMax, spreadY, color, pxScale, opacity, meanAU }) {
  const au = new Float32Array(count);
  const ang = new Float32Array(count);
  const yFrac = new Float32Array(count);
  const sizes = new Float32Array(count);
  const shades = new Float32Array(count);
  for (let i = 0; i < count; i++) {
    au[i] = auMin + Math.pow(Math.random(), 0.8) * (auMax - auMin);
    ang[i] = Math.random() * Math.PI * 2;
    // Sum of two randoms ≈ triangular distribution — denser near the plane.
    yFrac[i] = (Math.random() + Math.random() - 1) * spreadY;
    sizes[i] = 0.35 + Math.random() * 0.9;
    shades[i] = 0.45 + Math.random() * 0.55;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(count * 3), 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aShade', new THREE.BufferAttribute(shades, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uOpacity: { value: opacity },
      uPx: { value: pxScale },
    },
    vertexShader: `
      attribute float aSize;
      attribute float aShade;
      varying float vShade;
      uniform float uPx;
      #include <common>
  #include <logdepthbuf_pars_vertex>
      void main() {
        vShade = aShade;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = clamp(aSize * uPx / -mv.z, 0.5, 3.5);
        gl_Position = projectionMatrix * mv;
        #include <logdepthbuf_vertex>
      }`,
    fragmentShader: `
      varying float vShade;
      uniform vec3 uColor;
      uniform float uOpacity;
      #include <logdepthbuf_pars_fragment>
      void main() {
        #include <logdepthbuf_fragment>
        vec2 c = gl_PointCoord - 0.5;
        if (dot(c, c) > 0.25) discard;
        gl_FragColor = vec4(uColor * vShade, uOpacity);
      }`,
    transparent: true,
    depthWrite: false,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;  // re-projected on scale morph; skip culling
  const belt = {
    points,
    // Whole-belt rotation approximates Kepler motion at the mean radius.
    periodDays: Math.sqrt(meanAU * meanAU * meanAU) * 365.25,
    update() {
      const arr = geo.attributes.position.array;
      for (let i = 0; i < count; i++) {
        _beltProxy.orbitAU = au[i];
        const r = getSceneOrbitRadius(_beltProxy);
        arr[i * 3]     = Math.cos(ang[i]) * r;
        arr[i * 3 + 1] = r * yFrac[i];
        arr[i * 3 + 2] = Math.sin(ang[i]) * r;
      }
      geo.attributes.position.needsUpdate = true;
    },
  };
  belt.update();
  scene.add(points);
  BELTS.push(belt);
  return belt;
}

// Main belt between Mars and Jupiter; Kuiper belt beyond Neptune.
makeBelt({ count: 2600, auMin: 2.1, auMax: 3.4, spreadY: 0.045, color: '#9a8c7a', pxScale: 70, opacity: 0.8, meanAU: 2.75 });
makeBelt({ count: 2200, auMin: 32, auMax: 48, spreadY: 0.09, color: '#9fb4c4', pxScale: 110, opacity: 0.65, meanAU: 39 });

// ---------- Controls ----------
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 2.0;
controls.panSpeed = 0.6;
controls.minDistance = 1.5;
// Galactic-scale zoom. The scene scale is ~8 units per AU. To see the full
// Milky Way (diameter ~100,000 light-years ≈ 6.3 billion AU ≈ 5×10^10 scene
// units) we'd need a truly astronomical maxDistance. Instead, we cheat:
// the galaxy mesh is anchored in a relative coordinate space scaled to fit,
// and we let the user zoom out to maxDistance=2×10^7 (≈ 1.3 million AU =
// 20 light-years, far enough that the Milky Way panorama fills the view).
controls.maxDistance = 2e7;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

// ---------- Raycast ----------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let pointerDownAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  pointerDownAt = { x: e.clientX, y: e.clientY, t: Date.now() };
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!pointerDownAt) return;
  const dx = e.clientX - pointerDownAt.x;
  const dy = e.clientY - pointerDownAt.y;
  const dt = Date.now() - pointerDownAt.t;
  pointerDownAt = null;
  if (dx*dx + dy*dy > 25 || dt > 400) return;
  const rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const meshes = [];
  for (const obj of bodyObjects.values()) meshes.push(obj.mesh);
  // recursive=true so we hit child meshes of spacecraft groups.
  const hits = raycaster.intersectObjects(meshes, true);
  if (hits.length > 0) {
    // Walk up from the hit object until we find a userData.bodyId — that's
    // on the top-level mesh/group we registered.
    let o = hits[0].object;
    while (o && !o.userData?.bodyId) o = o.parent;
    if (o?.userData?.bodyId) openDetail(o.userData.bodyId);
  }
});

// ---------- Resize ----------
function resize() {
  const rect = host.getBoundingClientRect();
  renderer.setSize(rect.width, rect.height, false);
  composer.setSize(rect.width, rect.height);
  camera.aspect = rect.width / rect.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
setTimeout(resize, 50);

// ---------- Adaptive quality ----------
// Watch the real frame rate after a short warm-up; if the device can't hold
// ~40 fps, step down render resolution first, then drop the bloom composer
// (the EffectComposer round-trip is the costliest part on weak GPUs).
const qualityState = { tier: 0, bloomEnabled: true, frames: 0, elapsed: 0, warmup: 3 };
function trackPerformance(delta) {
  if (qualityState.tier >= 2 || document.hidden || delta > 0.5) return;
  if (qualityState.warmup > 0) { qualityState.warmup -= delta; return; }
  qualityState.frames++;
  qualityState.elapsed += delta;
  if (qualityState.elapsed < 2) return;
  const fps = qualityState.frames / qualityState.elapsed;
  qualityState.frames = 0;
  qualityState.elapsed = 0;
  if (fps >= 40) return;
  qualityState.tier++;
  if (qualityState.tier === 1) {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  } else {
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
    qualityState.bloomEnabled = false;
  }
  composer.setPixelRatio(renderer.getPixelRatio());
  resize();
}

// ---------- Animation loop ----------
const clock = new THREE.Clock();
const tmpDir = new THREE.Vector3();
const cameraToBody = new THREE.Vector3();
const _zAxis = new THREE.Vector3(0, 0, 1);
const _tmpAway = new THREE.Vector3();

// Which bodies cast shadows onto which: lunar eclipses on Earth, Earth's
// shadow on the Moon, Galilean moon transits across Jupiter and Jupiter
// eclipsing its moons, the Saturn system likewise.
const SHADOW_CASTERS = {
  earth: ['moon'],
  moon: ['earth'],
  jupiter: ['io', 'europa', 'ganymede', 'callisto'],
  io: ['jupiter'], europa: ['jupiter'], ganymede: ['jupiter'], callisto: ['jupiter'],
  saturn: ['titan', 'enceladus'], titan: ['saturn'], enceladus: ['saturn'],
};
const SHADOW_CASTER_ENTRIES = Object.entries(SHADOW_CASTERS);

// Feature longitudes — Y-rotation that puts a notable feature toward the camera.
// Used by spin-to-feature when a body is focused.
const FEATURE_LONGITUDES = {
  jupiter: Math.PI * 0.35,  // Great Red Spot
  mars:    Math.PI * 1.4,   // Olympus Mons region
  saturn:  Math.PI * 0.5,   // No major spot, just a pleasing view
};

// Time scrub state — declared before animate() since the loop reads them.
const scrubAnchorMs = Date.now();
let scrubDragging = false;

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  const speed = SPEEDS.find(s => s.id === state.speedId);
  const simDeltaDays = state.paused ? 0 : delta * speed.daysPerSec;
  state.simDateMs += simDeltaDays * 86400 * 1000;

  // Scale morph: ease scaleBlend toward its target and re-project the
  // geometry that depends on it. Body positions and radii are recomputed
  // below every frame anyway.
  if (state.scaleBlend !== state.scaleBlendTarget) {
    const dir = Math.sign(state.scaleBlendTarget - state.scaleBlend);
    let next = state.scaleBlend + dir * delta / 1.8;
    if ((dir > 0 && next >= state.scaleBlendTarget) || (dir < 0 && next <= state.scaleBlendTarget)) {
      next = state.scaleBlendTarget;
    }
    state.scaleBlend = next;
    updateOrbitLineGeometries();
    for (const belt of BELTS) belt.update();
  }

  // Belts revolve as rigid rings at the Kepler rate of their mean radius.
  const beltDays = (state.simDateMs - J2000_MS) / 86400000;
  for (const belt of BELTS) {
    belt.points.rotation.y = -(2 * Math.PI * beltDays) / belt.periodDays;
  }

  // Update positions
  for (const body of BODIES) {
    const obj = bodyObjects.get(body.id);
    if (!obj) continue;
    // Hide outer bodies (Voyagers, Sedna, Eris) unless the user opts in.
    // We still update their positions in case the user toggles them on,
    // but skip the rest of the heavy per-frame work.
    const hideOuter = isOuterBody(body) && !state.showOuter;
    if (hideOuter) {
      obj.group.visible = false;
      continue;
    } else {
      obj.group.visible = true;
    }
    let pos;
    if (body.parentId && body.parentId !== 'sun') {
      const parentObj = bodyObjects.get(body.parentId);
      if (parentObj) {
        pos = parentObj.group.position.clone().add(getBodyPosition(body, state.simDateMs));
      } else {
        pos = getBodyPosition(body, state.simDateMs);
      }
    } else {
      pos = getBodyPosition(body, state.simDateMs);
    }
    obj.group.position.copy(pos);

    // Keep the visual radius in sync with the scale morph. The label is
    // counter-scaled so its on-screen size stays constant.
    const visR = getBodyVisualRadius(body);
    if (visR !== obj.radius) {
      const f = visR / obj.baseRadius;
      obj.radius = visR;
      obj.group.scale.setScalar(f);
      obj.label.scale.set(2.2 / f, 0.55 / f, 1);
    }

    // Body rotation. If this body is currently selected AND it has a feature
    // we want to show (Jupiter's Red Spot, Mars's Olympus), gradually rotate
    // toward that orientation while focused, then resume normal spin.
    const isFocused = state.focusedId === body.id;
    const featureTarget = FEATURE_LONGITUDES[body.id];
    if (isFocused && featureTarget !== undefined) {
      // Smoothly orient the body so its feature faces the camera.
      // We compute current rotation and target rotation around Y.
      const currentY = obj.mesh.rotation.y;
      const targetY = featureTarget;
      let diff = (targetY - currentY) % (Math.PI * 2);
      if (diff > Math.PI) diff -= Math.PI * 2;
      if (diff < -Math.PI) diff += Math.PI * 2;
      obj.mesh.rotation.y += diff * Math.min(1, delta * 0.8);
    } else if (body.kind === 'spacecraft') {
      // Slow drift to give a sense of being a real object in space, not
      // a rapidly spinning planet. Most probes are 3-axis stabilized
      // anyway — this is purely for visual interest.
      obj.mesh.rotation.y += delta * 0.04;

      // Crossfade between the billboard "spot" (visible far away) and the
      // detailed 3D model (visible close up). Without this, faraway probes
      // either vanish to a sub-pixel or float as oversized lego pieces.
      const distToCam = camera.position.distanceTo(pos);
      // "near": fully show detail. "far": fully show spot. Linear blend between.
      const near = obj.radius * 12;
      const far  = obj.radius * 60;
      const t = Math.max(0, Math.min(1, (distToCam - near) / (far - near)));
      // t=0 → all detail. t=1 → all spot.
      obj.mesh.children.forEach(child => {
        if (child.userData?.isSpacecraftDetail) {
          child.visible = t < 0.98;
          child.scale.setScalar(1);
          // Apply opacity via traversal — set material.transparent + opacity.
          child.traverse(m => {
            if (m.material && m.material.opacity !== undefined) {
              if (!m.material.transparent) {
                m.material.transparent = true;
              }
              m.material.opacity = 1 - t;
            }
          });
        } else if (child.userData?.isSpacecraftSpot) {
          // Hide spacecraft spots once we're zoomed out enough that they'd
          // visually clutter the galaxy view.
          const galaxyHiding = distToCam > 50000;
          child.visible = !galaxyHiding && t > 0.02;
          child.material.opacity = t * (galaxyHiding ? 0 : 1);
          // Scale spot up to remain a visible dot at outer-system zoom,
          // but cap the size so it doesn't become a giant blob.
          const baseScale = obj.radius * 1.6;
          const minScale = Math.min(
            Math.max(baseScale, distToCam * 0.004),
            baseScale * 50
          );
          child.scale.set(minScale, minScale, 1);
        }
      });
    } else if (body.dayHours) {
      // Real rotation: one revolution per dayHours of *simulated* time, so
      // Jupiter visibly outpaces Earth and the speed control matters.
      // Retrograde rotators (axial tilt > 90°: Venus, Uranus, Pluto) spin
      // the other way.
      const spinSign = body.axialTilt > 90 ? -1 : 1;
      const spinDelta = spinSign * simDeltaDays * 24 / body.dayHours * Math.PI * 2;
      obj.mesh.rotation.y = (obj.mesh.rotation.y + spinDelta) % (Math.PI * 2);

      if (body.id === 'sun') {
        const u = obj.mesh.material?.uniforms;
        if (u?.uTime) u.uTime.value = (u.uTime.value + delta) % 100000;
      }
    }

    // Sun direction in world space — per-body uniform shared by the
    // surface and atmosphere shaders of this body.
    tmpDir.set(0, 0, 0).sub(pos).normalize();
    if (obj.sunUni) obj.sunUni.value.copy(tmpDir);
    obj.group.traverse(child => {
      if (child.userData?.isClouds) {
        // Clouds drift a touch faster than the ground. Feed the offset to
        // the surface shader so projected cloud shadows track the layer.
        const spinSign = body.axialTilt > 90 ? -1 : 1;
        child.rotation.y = (child.rotation.y + spinSign * simDeltaDays * 24 / body.dayHours * Math.PI * 2 * 1.06 + delta * 0.002) % (Math.PI * 2);
        if (child.material.uniforms?.uSunDir) {
          child.material.uniforms.uSunDir.value.copy(tmpDir);
        }
        const u = obj.mesh.material?.uniforms;
        if (u?.uCloudShift) {
          u.uCloudShift.value = (child.rotation.y - obj.mesh.rotation.y) / (Math.PI * 2);
        }
      }
      // Ring shadow: convert world-space sun direction to ring's local space.
      if (child.userData?.isRing && child.material.uniforms?.uSunLocal) {
        const sunLocal = tmpDir.clone();
        // Reverse the ring's world rotation to get local-space direction.
        const ringInverseQuat = child.getWorldQuaternion(new THREE.Quaternion()).invert();
        sunLocal.applyQuaternion(ringInverseQuat);
        child.material.uniforms.uSunLocal.value.copy(sunLocal);
      }
    });

    // Hide labels for hidden outer bodies — already covered by group.visible
    // but the sprite itself still gets rendered if depthTest is off, so
    // double-down on it here.
    if (obj.label && !obj.group.visible) obj.label.visible = false;

    // Comet tail: always anti-sunward, and it grows/brightens steeply as
    // the comet approaches perihelion — like the real thing.
    if (body.kind === 'comet') {
      const rAU = currentHelioAU(body, state.simDateMs);
      const strength = THREE.MathUtils.clamp((4.0 - rAU) / 3.4, 0, 1);
      const away = _tmpAway.copy(pos).normalize();
      obj.group.children.forEach(child => {
        if (child.userData?.isTail) {
          child.quaternion.setFromUnitVectors(_zAxis, away);
          child.scale.setScalar(0.25 + strength * 1.15);
          child.material.uniforms.uStrength.value = 0.08 + 0.92 * strength;
        } else if (child.userData?.isComa) {
          child.material.opacity = 0.15 + 0.75 * strength;
          const s = obj.radius * (3 + strength * 5);
          child.scale.set(s, s, 1);
        }
      });
    }

    // Fade labels at close camera distance. Hide the label for the focused
    // body — its name is in the overlay anyway.
    if (state.focusedId === body.id) {
      obj.label.visible = false;
    } else {
      cameraToBody.copy(camera.position).sub(pos);
      const distance = cameraToBody.length();
      const minFadeDist = obj.radius * 6;
      const maxFadeDist = obj.radius * 18;
      const labelOpacity = THREE.MathUtils.clamp(
        (distance - minFadeDist) / (maxFadeDist - minFadeDist),
        0,
        1,
      );
      obj.label.material.opacity = labelOpacity * 0.85;
      obj.label.visible = labelOpacity > 0.02;
    }
  }

  // ---------- Eclipse / transit shadow uniforms ----------
  // Runs after the position loop so every caster has this frame's position.
  for (const [recvId, casterIds] of SHADOW_CASTER_ENTRIES) {
    const recv = bodyObjects.get(recvId);
    const u = recv?.mesh.material?.uniforms;
    if (!u || !u.uOccCount) continue;
    if (!recv.group.visible) { u.uOccCount.value = 0; continue; }
    let n = 0;
    for (const cid of casterIds) {
      if (n >= 4) break;
      const c = bodyObjects.get(cid);
      if (!c || !c.group.visible) continue;
      u.uOccPos.value[n].copy(c.group.position);
      u.uOccRadius.value[n] = c.radius;
      n++;
    }
    u.uOccCount.value = n;
  }

  // ---------- Camera animation & focus tracking ----------
  if (state.cameraAnim) {
    const anim = state.cameraAnim;
    anim.t += delta;
    const linearT = Math.min(1, anim.t / anim.duration);
    const t = easeInOutCubic(linearT);

    // If we're flying toward a body, update its target every frame — the body
    // is moving along its orbit, so we recompute the standoff position so the
    // camera lands at the right spot relative to its CURRENT location.
    let liveTarget = anim.target;
    if (state.focusedId) {
      const obj = bodyObjects.get(state.focusedId);
      if (obj) {
        const bodyPos = obj.group.position.clone();
        // Same offset math as flyToBody.
        const toSun = bodyPos.clone().negate().normalize();
        if (toSun.lengthSq() < 0.001) toSun.set(0.6, 0.3, 1).normalize();
        const standoff = Math.max(obj.radius * 6, 2.5);
        const sideAngle = Math.PI * 0.18;
        const sin = Math.sin(sideAngle), cos = Math.cos(sideAngle);
        const cameraDir = new THREE.Vector3(
          toSun.x * cos - toSun.z * sin,
          toSun.y,
          toSun.x * sin + toSun.z * cos,
        ).normalize();
        anim.to = bodyPos.clone()
          .add(cameraDir.multiplyScalar(standoff))
          .add(new THREE.Vector3(0, standoff * 0.22, 0));
        liveTarget = bodyPos;   // keep the planet centered in the viewport
      }
    }

    camera.position.lerpVectors(anim.from, anim.to, t);
    controls.target.lerpVectors(anim.fromTarget, liveTarget, t);

    if (linearT >= 1) {
      state.cameraAnim = null;
      controls.enabled = true;
    }
  } else if (state.focusedId) {
    // Focus mode: follow the focused body along its orbit, but don't fight
    // the user's manual zoom/rotate input.
    const obj = bodyObjects.get(state.focusedId);
    if (obj) {
      const bodyPos = obj.group.position;
      const distFromBody = camera.position.distanceTo(bodyPos);
      const standoff = Math.max(obj.radius * 6, 2.5);

      // If the user has zoomed out well past the standoff, they're trying to
      // get a wider view — release the focus and let them roam freely.
      if (distFromBody > standoff * 3.5) {
        exitFocus();
      } else {
        // Move the camera and target by the same delta as the planet moved
        // since last frame. This keeps the planet in the same screen-space
        // position without constraining zoom or rotation.
        const lastTarget = controls.target;
        const dx = bodyPos.x - lastTarget.x;
        const dy = bodyPos.y - lastTarget.y;
        const dz = bodyPos.z - lastTarget.z;
        camera.position.x += dx;
        camera.position.y += dy;
        camera.position.z += dz;
        controls.target.copy(bodyPos);
      }
    }
  }

  // Sun sprite scales with camera distance so it stays a visible glow
  // even at galactic-scale zoom. Hide it when close so it doesn't fight
  // the real Sun sphere; bring it in gradually as we pull back.
  const camDist = camera.position.length();
  if (camDist < 20) {
    sunSprite.visible = false;
  } else {
    sunSprite.visible = true;
    // Sprite linear size = ~0.025 × camDist, but capped so it doesn't
    // grow into a huge disc at galactic-scale zoom. Once the galaxy view
    // takes over, the Sun is a single point inside the disk.
    const s = Math.min(Math.max(0.6, camDist * 0.025), 60000);
    sunSprite.scale.set(s, s, 1);
    // Fade slightly stronger when very far so it punches through skybox.
    const op = Math.min(1, 0.4 + camDist / 8000);
    sunSprite.material.opacity = op;
  }

  // Fade out orbit lines on zoom-out — they become noisy clutter past
  // ~300 units, and beyond ~5000 they have no visual meaning at all.
  const orbitOpacity = camDist < 200 ? 0.08
                     : camDist < 5000 ? Math.max(0, 0.08 * (1 - (camDist - 200) / 4800))
                     : 0;
  for (const line of orbitLines) {
    if (line.material && !line.userData.highlighted) {
      line.material.opacity = orbitOpacity;
    }
  }

  // Milky Way panorama fades in as the camera retreats. The panorama is a
  // single equirectangular sphere, so we adjust its opacity directly.
  // Threshold: it starts appearing past ~5000 scene units and reaches full
  // visibility past ~200,000 — by which point the cubemap and ambient
  // lighting have made room for it.
  const galaxyOpacity = camDist < 5000 ? 0
                      : camDist < 200000 ? (camDist - 5000) / 195000
                      : 1;
  if (galaxyMesh) {
    galaxyMesh.visible = galaxyOpacity > 0.01;
    galaxyMesh.material.opacity = galaxyOpacity;
  }
  // As the panorama fades in, fade out the cubemap stars so they don't
  // double up. Scene.backgroundIntensity (r152+) controls cubemap brightness.
  if ('backgroundIntensity' in scene) {
    scene.backgroundIntensity = 1 - galaxyOpacity * 0.95;
  }

  // Hide the Sun sprite when fully into galaxy view — at that scale the
  // Sun is one of billions of stars in the panorama and shouldn't dominate.
  if (galaxyOpacity > 0.6) {
    const fade = 1 - (galaxyOpacity - 0.6) / 0.4;
    sunSprite.material.opacity *= Math.max(0, fade);
  }

  // Bloom adapts to camera distance — at galactic-scale zoom the Sun is a
  // single bright pixel and stock bloom (0.6) makes it dominate the whole
  // frame. Reduce bloom strength smoothly as we pull back.
  const bloomStrength = camDist < 100 ? 0.6
                      : camDist < 2000 ? 0.6 - (camDist - 100) / 2000 * 0.5
                      : 0.1;
  bloomPass.strength = bloomStrength;

  controls.update();
  if (qualityState.bloomEnabled) {
    composer.render();
  } else {
    renderer.render(scene, camera);
  }
  trackPerformance(delta);
  updateInfoPinPosition();

  document.getElementById('sim-date').textContent = fmt.simDate(state.simDateMs);
  // Update the time-scrub slider value to match sim time (unless the user
  // is dragging — we skip in that case).
  if (!scrubDragging) {
    const scrub = document.getElementById('time-scrub');
    if (scrub) {
      const yearsFromNow = (state.simDateMs - scrubAnchorMs) / (365.25 * 86400_000);
      scrub.value = String(yearsFromNow.toFixed(3));
    }
  }
}
animate();

/**
 * Animate the camera so it ends up near `id`, looking at it from a position
 * that puts the body's lit side toward the camera. The animation respects
 * the body's current world position; once the flight finishes, focus mode
 * takes over and keeps the body in view as it orbits.
 */
function flyToBody(id) {
  const obj = bodyObjects.get(id);
  if (!obj) return;
  const targetPos = obj.group.position.clone();

  // Build a camera offset that:
  //  - shows the sunlit hemisphere (camera stands on the Sun's side, looking
  //    "back" toward the planet);
  //  - offsets slightly above the ecliptic for a 3/4 view;
  //  - has a small lateral tilt so the lighting terminator is visible.
  //
  // The planet stays CENTERED in the viewport — the user can read it without
  // any overlay on top. The Info pin floats next to it; if the user wants
  // details, they tap the pin and the overlay slides in from the right.
  const toSun = targetPos.clone().negate().normalize();
  if (toSun.lengthSq() < 0.001) {
    toSun.set(0.6, 0.3, 1).normalize();
  }
  const standoff = Math.max(obj.radius * 6, 2.5);

  const sideAngle = Math.PI * 0.18;   // ~32°
  const sin = Math.sin(sideAngle), cos = Math.cos(sideAngle);
  const cameraDir = new THREE.Vector3(
    toSun.x * cos - toSun.z * sin,
    toSun.y,
    toSun.x * sin + toSun.z * cos,
  ).normalize();

  const cameraTarget = targetPos.clone()
    .add(cameraDir.multiplyScalar(standoff))
    .add(new THREE.Vector3(0, standoff * 0.22, 0));

  state.cameraAnim = {
    from: camera.position.clone(),
    fromTarget: controls.target.clone(),
    to: cameraTarget,
    target: targetPos.clone(),    // look directly at the planet — keep it centered
    t: 0,
    duration: 1.6,
  };
  controls.enabled = false;
}

/**
 * Instantaneous orbital speed in km/s using the vis-viva equation:
 *   v² = GM * (2/r - 1/a)
 * For moons we use the parent's mass; for Sun-orbiters we use the Sun.
 * Returns 0 if the body doesn't orbit (the Sun itself, spacecraft with
 * unspecified orbits).
 */
function computeOrbitalSpeed(body) {
  // Spacecraft with a known state vector: just take the magnitude of the
  // velocity vector (it's already in AU/day, convert to km/s).
  if (body.propagation === 'linear' && body.stateVel) {
    const [vx, vy, vz] = body.stateVel;
    const auPerDay = Math.sqrt(vx*vx + vy*vy + vz*vz);
    return auPerDay * 1.495978707e8 / 86400;  // km / s
  }
  // L2 orbiter: roughly Earth's orbital speed (it co-orbits the Sun with Earth).
  if (body.propagation === 'l2_earth') return 29.78;
  if (!body.orbitAU || body.yearYears === 0) return 0;
  // GM in m³/s² for Sun, Earth, Jupiter, Saturn.
  const GM = {
    sun: 1.32712440018e20,
    earth: 3.986e14,
    jupiter: 1.26687e17,
    saturn: 3.7931e16,
  };
  const parent = body.parentId || 'sun';
  const mu = GM[parent] ?? GM.sun;
  const AU_M = 1.495978707e11;
  const a = body.orbitAU * AU_M;
  const r = a;
  const v = Math.sqrt(mu * (2 / r - 1 / a)); // m/s
  return v / 1000; // km/s
}

/**
 * Current heliocentric distance (AU) for a spacecraft — projected forward
 * from the epoch state vector. For L2 orbiters, the distance equals Earth's
 * (≈1 AU). For Kepler orbiters around a non-Sun parent, we'd need to add
 * the parent's distance to Sun, but that's a small effect we ignore here.
 */
function getSpacecraftDistAU(body) {
  if (body.propagation === 'linear' && body.statePos) {
    const daysSinceEpoch = (state.simDateMs - SPACECRAFT_EPOCH_MS) / 86400000;
    const x = body.statePos[0] + body.stateVel[0] * daysSinceEpoch;
    const y = body.statePos[1] + body.stateVel[1] * daysSinceEpoch;
    const z = body.statePos[2] + body.stateVel[2] * daysSinceEpoch;
    return Math.sqrt(x*x + y*y + z*z);
  }
  if (body.propagation === 'l2_earth') return 1.0;
  return body.orbitAU || 0;
}

/** Render a stat row with a value that will animate from 0 to target. */
function statRow(label, target, format) {
  // For non-numeric or zero values, just show formatted result directly.
  const numericTarget = typeof target === 'number' && isFinite(target) ? target : 0;
  return `<div>
    <span class="stat-label">${label}</span>
    <span class="stat-value" data-target="${numericTarget}" data-format="${format}">${formatStat(0, format)}</span>
  </div>`;
}

function formatStat(value, format) {
  switch (format) {
    case 'km':    return `${Math.round(value).toLocaleString('en-US')} km`;
    case 'mass':  return value === 0 ? '—' : `${value.toExponential(2)} kg`;
    case 'au':    return `${value.toFixed(3)} AU`;
    case 'ecc':   return value.toFixed(3);
    case 'deg':   return `${value.toFixed(1)}°`;
    case 'years': return value === 0 ? '—' : `${value.toFixed(2)} ${t('unitYears')}`;
    case 'hours': return value === 0 ? '—' : `${value.toFixed(1)} ${t('unitHours')}`;
    case 'speed': return value === 0 ? '—' : `${value.toFixed(2)} km/s`;
    default:      return String(value);
  }
}

/** Animate the text content of an element from 0 to target with easing. */
function animateNumber(el, target, format) {
  if (target === 0) {
    el.textContent = formatStat(0, format);
    return;
  }
  const duration = 800; // ms
  const start = performance.now();
  function tick(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = easeInOutCubic(t);
    el.textContent = formatStat(target * eased, format);
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

/** Plain-text "X× vs Earth" badge. The previous SVG version blew the layout
 *  open for gas giants (Saturn's 9× silhouette overflowed the panel and
 *  pushed everything else off-screen) — text scales cleanly at every size. */
function buildComparison(b, ratio) {
  const ratioLabel = ratio >= 1
    ? `${ratio.toFixed(ratio >= 10 ? 0 : 1)}${t('ratioLarger')}`
    : `${(1 / ratio).toFixed(1)}${t('ratioSmaller')}`;
  return `
    <div class="comparison glass">
      <div class="comparison-label">${t('sizeVsEarth')}</div>
      <div class="comparison-ratio">${ratioLabel}</div>
    </div>`;
}

  const dict = {
    en: 'Info', ru: 'Инфо', es: 'Info', de: 'Info', fr: 'Info',
    pt: 'Info', it: 'Info', uk: 'Iнфо', zh: '信息', ja: '情報', ko: '정보',
  };
  return dict[lang] || dict.en;
}

function showInfoPin(id) {

function hideInfoPin() {

/**
 * Update the screen-space position of the Info pin every frame. Called
 * from the animate loop. We project the body's 3D position to NDC, then
 * convert to device pixels, then position the pin next to the planet.
 */
const _pinProjVec = new THREE.Vector3();
function updateInfoPinPosition() {
  const pin = document.getElementById('info-pin');
  if (!pin) return;
  // Only run if the pin is "active" — i.e. a body is focused and the overlay
  // is closed.
  if (pin.dataset.active !== '1') {
    pin.classList.remove('show');
    return;
  }
  const id = pin.dataset.bodyId;
  if (!id) return;
  const obj = bodyObjects.get(id);
  if (!obj) return;

  // Don't show during camera flight — the pin would slide across the screen.
  if (state.cameraAnim) {
    pin.classList.remove('show');
    return;
  }

  // Project to screen.
  _pinProjVec.copy(obj.group.position).project(camera);
  // Behind camera? Hide.
  if (_pinProjVec.z > 1) {
    pin.classList.remove('show');
    return;
  }

  const rect = renderer.domElement.getBoundingClientRect();
  const x = (_pinProjVec.x * 0.5 + 0.5) * rect.width;
  const y = (-_pinProjVec.y * 0.5 + 0.5) * rect.height;

  // Place the pin slightly to the right of the planet, offset by the
  // visible radius in pixels. To estimate that, project a point on the

    .add(camera.up.clone().normalize().multiplyScalar(0));   // dummy — we use a fixed pixel offset instead
  // Simpler: just use a fixed pixel offset of ~30px to the side.
  pin.style.left = `${Math.round(x + 22)}px`;
  pin.style.top  = `${Math.round(y - 14)}px`;

  // Refresh 3D billboard labels — their text was baked into a canvas

function attachDragClose(sheet) {
  let startY = null, currentY = null, dragging = false;
  const handle = sheet.querySelector('.sheet-handle');
  const onStart = (clientY) => {
    startY = clientY; currentY = clientY; dragging = true;
    sheet.style.transition = 'none';
  };
  const onMove = (clientY) => {
    if (!dragging) return;
    currentY = clientY;
    const dy = Math.max(0, currentY - startY);
    sheet.style.transform = `translateY(${dy}px)`;
  };
  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    const dy = currentY - startY;
    sheet.style.transform = '';
    if (dy > 100) closeAllSheets();
  };
  handle.addEventListener('touchstart', e => onStart(e.touches[0].clientY), {passive:true});
  handle.addEventListener('touchmove', e => onMove(e.touches[0].clientY), {passive:true});
  handle.addEventListener('touchend', onEnd);
  handle.addEventListener('mousedown', e => onStart(e.clientY));
  window.addEventListener('mousemove', e => onMove(e.clientY));
  window.addEventListener('mouseup', onEnd);
}

// ---------- Ambient sound (procedural via Web Audio API) ----------
let audioCtx = null;
let audioNodes = null;
function startAmbient() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // Low drone — three sine oscillators at different frequencies, gentle gain
  // envelope. No external files, no autoplay until user clicks the button.
  const master = audioCtx.createGain();
  master.gain.value = 0.0;
  master.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 1.5);
  master.connect(audioCtx.destination);
  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 600;
  filter.Q.value = 5;
  filter.connect(master);
  const oscs = [];
  for (const freq of [55, 82.4, 110, 165]) {
    const o = audioCtx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    const g = audioCtx.createGain();
    g.gain.value = 0.18 + Math.random() * 0.1;
    o.connect(g).connect(filter);
    o.start();
    oscs.push({ o, g });
    // Tiny LFO on each gain.
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.07 + Math.random() * 0.1;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = 0.08;
    lfo.connect(lfoGain).connect(g.gain);
    lfo.start();
  }
  audioNodes = { master, filter, oscs };
}
function stopAmbient() {
  if (!audioCtx) return;
  audioNodes.master.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
  setTimeout(() => {
    audioCtx.close();
    audioCtx = null;
    audioNodes = null;
  }, 900);
}
{
  const btn = document.getElementById('sound-toggle');
  if (btn) {
    btn.addEventListener('click', () => {
      state.audioOn = !state.audioOn;
      btn.classList.toggle('on', state.audioOn);
      btn.setAttribute('aria-label', state.audioOn ? 'Mute ambient' : 'Play ambient');
      btn.innerHTML = state.audioOn
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12a4.5 4.5 0 0 0-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.96 8.96 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>';
      if (state.audioOn) startAmbient();
      else stopAmbient();

  }
}

// ===================================================================
// ASTRONOMICAL EVENTS — calendar-style pill in the top bar
// ===================================================================
// Dates verified against published almanacs (NASA Eclipse, Time and Date).
// All dates are UTC. Body id is what we focus the camera on when the user
// taps "Show me". The list is short and curated — adding moons/oppositions
// for every month is noise; the goal is "is anything interesting coming up?"

const ASTRO_EVENTS = [
  { date: '2026-02-12', type: 'jupiterOpposition', bodyId: 'jupiter' },
  { date: '2026-02-17', type: 'solarEclipse',      bodyId: 'sun'     },
  { date: '2026-03-03', type: 'lunarEclipse',      bodyId: 'moon'    },
  { date: '2026-08-12', type: 'solarEclipse',      bodyId: 'sun'     },
  { date: '2026-08-13', type: 'perseids',          bodyId: 'earth'   },
  { date: '2026-08-28', type: 'lunarEclipse',      bodyId: 'moon'    },
  { date: '2026-09-22', type: 'saturnOpposition',  bodyId: 'saturn'  },
  { date: '2026-12-14', type: 'geminids',          bodyId: 'earth'   },
  { date: '2027-02-06', type: 'solarEclipse',      bodyId: 'sun'     },
  { date: '2027-02-19', type: 'marsOpposition',    bodyId: 'mars'    },
  { date: '2027-03-19', type: 'jupiterOpposition', bodyId: 'jupiter' },
  { date: '2027-08-02', type: 'solarEclipse',      bodyId: 'sun'     },
  { date: '2027-08-13', type: 'perseids',          bodyId: 'earth'   },
  { date: '2027-10-04', type: 'saturnOpposition',  bodyId: 'saturn'  },
  { date: '2027-12-14', type: 'geminids',          bodyId: 'earth'   },
];

/** Pick the upcoming event closest to today, or the most recent past one
 *  if everything is in the future by more than 30 days. */
function nearestEvent() {
  const nowMs = Date.now();
  let bestFuture = null, bestFutureDelta = Infinity;
  let bestPast   = null, bestPastDelta   = Infinity;
  for (const ev of ASTRO_EVENTS) {
    const delta = Date.parse(ev.date + 'T00:00:00Z') - nowMs;
    if (delta >= -12 * 3600_000) {
      if (delta < bestFutureDelta) { bestFutureDelta = delta; bestFuture = ev; }
    } else {
      if (-delta < bestPastDelta) { bestPastDelta = -delta; bestPast = ev; }
    }
  }
  return bestFuture || bestPast;
}

function formatEventCountdown(eventDateMs) {
  const days = Math.round((eventDateMs - Date.now()) / 86400000);
  if (days === 0) return t('eventToday');
  if (days === 1) return t('eventTomorrow');
  if (days > 0)   return t('eventInDays').replace('{n}', days);
  return t('eventLast').replace('{n}', -days);
}

function renderEventPill() {
  const pill = document.getElementById('event-pill');
  if (!pill) return;
  const ev = nearestEvent();
  if (!ev) { pill.hidden = true; return; }
  const dateMs = Date.parse(ev.date + 'T00:00:00Z');
  const title = t('event.' + ev.type);
  pill.textContent = `${formatEventCountdown(dateMs)} · ${title}`;
  pill.hidden = false;
  pill.dataset.eventIdx = ASTRO_EVENTS.indexOf(ev);
}

function openEventDetail(ev) {
  const overlay = document.getElementById('event-overlay');
  const body    = document.getElementById('event-body');
  if (!overlay || !body) return;
  const dateMs = Date.parse(ev.date + 'T00:00:00Z');
  const locale = state.lang === 'ru' ? 'ru-RU' : state.lang === 'uz' ? 'uz-UZ' : 'en-US';
  const dateLabel = new Date(dateMs).toLocaleDateString(locale, {
    year: 'numeric', month: 'long', day: 'numeric', timeZone: 'UTC',
  });
  body.innerHTML = `
    <h2 class="event-title">${t('event.' + ev.type)}</h2>
    <div class="event-date">${dateLabel} · ${formatEventCountdown(dateMs)}</div>
    <p class="event-desc">${t('event.' + ev.type + 'Desc')}</p>
    <button class="event-go" id="event-go">${t('eventGo')}</button>
  `;
  overlay.hidden = false;
  document.getElementById('event-go').addEventListener('click', () => {
    overlay.hidden = true;
    state.simDateMs = dateMs;
    // Sync the time-scrub slider so subsequent user drags relate to this date.
    const scrub = document.getElementById('time-scrub');
    if (scrub) {
      const years = (dateMs - scrubAnchorMs) / (365.25 * 86_400_000);
      scrub.value = String(Math.max(-50, Math.min(50, years)));
    }
    if (ev.bodyId) openDetail(ev.bodyId);
  });
}

document.getElementById('event-pill')?.addEventListener('click', () => {
  const idx = parseInt(document.getElementById('event-pill').dataset.eventIdx, 10);
  const ev = ASTRO_EVENTS[idx];
  if (ev) openEventDetail(ev);
});

// CONSTELLATIONS — toggleable line drawings on the celestial sphere
// ===================================================================
// Star positions are equatorial coordinates (RA in hours, Dec in degrees).
// We project them onto a sphere far behind the planets so the lines feel
// "in the sky" and don't intersect the solar system.

const CONSTELLATION_RADIUS = 600;
const CONSTELLATIONS = [
  {
    id: 'big_dipper',
    name: { en: 'Big Dipper', ru: 'Большая Медведица', uz: 'Katta Ayiq' },
    stars: [[11.06, 61.75], [11.03, 56.38], [11.90, 53.69], [12.26, 57.03],
            [12.90, 55.96], [13.40, 54.92], [13.79, 49.31]],
    lines: [[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]],
  },
  {
    id: 'orion',
    name: { en: 'Orion', ru: 'Орион', uz: 'Orion' },
    // Betelgeuse, Bellatrix, Mintaka, Alnilam, Alnitak, Saiph, Rigel
    stars: [[5.92, 7.41], [5.42, 6.35], [5.53, -0.30], [5.60, -1.20],
            [5.68, -1.94], [5.80, -9.67], [5.24, -8.20]],
    lines: [[0,1],[1,2],[2,3],[3,4],[4,0],[4,5],[2,6]],
  },
  {
    id: 'cassiopeia',
    name: { en: 'Cassiopeia', ru: 'Кассиопея', uz: 'Kassiopeya' },
    stars: [[0.15, 59.15], [0.68, 56.54], [0.95, 60.72], [1.43, 60.24], [1.91, 63.67]],
    lines: [[0,1],[1,2],[2,3],[3,4]],
  },
  {
    id: 'cygnus',
    name: { en: 'Cygnus', ru: 'Лебедь', uz: 'Oqqush' },
    // Deneb, Sadr, Albireo, Fawaris (δ Cyg), Gienah (ε Cyg)
    stars: [[20.69, 45.28], [20.37, 40.26], [19.51, 27.96], [19.75, 45.13], [20.77, 33.97]],
    lines: [[0,1],[1,2],[3,1],[1,4]],
  },
  {
    id: 'leo',
    name: { en: 'Leo', ru: 'Лев', uz: 'Arslon' },
    // Regulus, Algieba, Adhafera, Rasalas, Algenubi, Denebola, Zosma, Chertan
    stars: [[10.14, 11.97], [10.33, 19.84], [10.28, 23.42], [9.88, 26.01],
            [9.76, 23.77], [11.82, 14.57], [11.24, 20.52], [11.24, 15.43]],
    lines: [[0,1],[1,2],[2,3],[3,4],[1,6],[6,5],[5,7],[7,0]],
  },
];

const constellationGroup = new THREE.Group();
constellationGroup.visible = false;
scene.add(constellationGroup);

function raDecToVec3(raHours, decDeg, radius) {
  const ra  = raHours * 15 * Math.PI / 180;
  const dec = decDeg * Math.PI / 180;
  return new THREE.Vector3(
    radius * Math.cos(dec) * Math.cos(ra),
    radius * Math.sin(dec),
    radius * Math.cos(dec) * Math.sin(ra),
  );
}

function buildConstellations() {
  while (constellationGroup.children.length) constellationGroup.remove(constellationGroup.children[0]);
  for (const c of CONSTELLATIONS) {
    const positions = c.stars.map(([ra, dec]) => raDecToVec3(ra, dec, CONSTELLATION_RADIUS));

    const linePts = [];
    for (const [a, b] of c.lines) { linePts.push(positions[a], positions[b]); }
    const lineGeom = new THREE.BufferGeometry().setFromPoints(linePts);
    const lineMat  = new THREE.LineBasicMaterial({ color: 0x6FB7E8, transparent: true, opacity: 0.35 });
    const lines = new THREE.LineSegments(lineGeom, lineMat);
    constellationGroup.add(lines);

    const dotGeom = new THREE.BufferGeometry().setFromPoints(positions);
    const dotMat  = new THREE.PointsMaterial({ color: 0xCCE6FF, size: 4, sizeAttenuation: false, transparent: true, opacity: 0.9 });
    const dots = new THREE.Points(dotGeom, dotMat);
    constellationGroup.add(dots);
  }
}

function toggleConstellations() {
  constellationGroup.visible = !constellationGroup.visible;
  const btn = document.getElementById('constellation-toggle');
  if (btn) btn.classList.toggle('toggle-on', constellationGroup.visible);
}

buildConstellations();

// SOUND EFFECTS — subtle WebAudio cues on user actions

let _audioCtx = null;
function getAudioCtx() {
  if (_audioCtx) return _audioCtx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) _audioCtx = new AC();
  } catch (_) { _audioCtx = null; }
  return _audioCtx;
}
function ensureAudioRunning() {
  const ctx = getAudioCtx();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
  return ctx;
}
// One-time gesture handler so the first user tap warms up the audio context.
const _warmAudio = () => { ensureAudioRunning(); window.removeEventListener('touchstart', _warmAudio); window.removeEventListener('pointerdown', _warmAudio); };
window.addEventListener('touchstart', _warmAudio, { passive: true });
window.addEventListener('pointerdown', _warmAudio, { passive: true });

function playClick() {
  const ctx = ensureAudioRunning();
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(1320, t);
  osc.frequency.exponentialRampToValueAtTime(660, t + 0.06);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(0.10, t + 0.005);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.08);
}

function playWhoosh() {
  const ctx = ensureAudioRunning();
  if (!ctx) return;
  const t = ctx.currentTime;
  const buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(1600, t);
  filter.frequency.exponentialRampToValueAtTime(300, t + 0.35);
  filter.Q.value = 0.8;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.18, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
  src.connect(filter).connect(gain).connect(ctx.destination);
  src.start(t);
}

function playTick() {
  const ctx = ensureAudioRunning();
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 3200;
  gain.gain.setValueAtTime(0.04, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
  osc.connect(gain).connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.04);
}

function haptic(kind) {
  try {
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(kind || 'light');
  } catch (_) {}
}

// ===================================================================
// ANIMATED EVENT CAMERA — fly to the alignment, not just a date jump
// ===================================================================
// When the user taps "Show me" on an astronomical event, instead of an
// instant cut to the date and the target body, we orchestrate a short
// flight that puts the camera at a vantage which makes the alignment
// readable: for an opposition, looking down the Sun-Earth-planet line;
// for an eclipse, hovering near the Earth-Moon system; for a meteor
// shower, drifting in toward Earth.

function flyToAlignment(eventType, bodyId, simDateMs) {
  // Step 1 — set the simulation date so all body positions recompute.
  state.simDateMs = simDateMs;
  const scrub = document.getElementById('time-scrub');
  if (scrub) {
    const years = (simDateMs - scrubAnchorMs) / (365.25 * 86_400_000);
    scrub.value = String(Math.max(-50, Math.min(50, years)));
  }

  // Step 2 — pick the vantage point depending on event type.
  // Wait one frame so body positions in the scene reflect the new date.
  requestAnimationFrame(() => {
    const earthObj = bodyObjects.get('earth');
    const targetObj = bodyObjects.get(bodyId);
    if (!earthObj || !targetObj) { if (bodyId) openDetail(bodyId); return; }

    const earthPos  = earthObj.group.position.clone();
    const targetPos = targetObj.group.position.clone();

    let lookAt, cameraPos;

    if (eventType === 'lunarEclipse' || eventType === 'solarEclipse') {
      // Close-up of the Earth-Moon system, looking across the Sun line.
      const moonObj = bodyObjects.get('moon');
      const moonPos = moonObj ? moonObj.group.position.clone() : earthPos.clone();
      lookAt = earthPos.clone().add(moonPos).multiplyScalar(0.5);
      // Camera placed perpendicular to the Earth-Sun line, slightly above.
      const earthDir = earthPos.clone().normalize();
      const perp = new THREE.Vector3(-earthDir.z, 0, earthDir.x).normalize();
      cameraPos = lookAt.clone().add(perp.multiplyScalar(1.6)).add(new THREE.Vector3(0, 0.7, 0));
    } else if (eventType === 'perseids' || eventType === 'geminids') {
      // Drift in toward Earth — meteor showers happen in Earth's atmosphere.
      lookAt = earthPos.clone();
      const earthDir = earthPos.clone().normalize();
      cameraPos = earthPos.clone().add(earthDir.multiplyScalar(-1.4)).add(new THREE.Vector3(0, 0.8, 0));
    } else {
      // Opposition: target planet on the far side of Earth from the Sun.
      // Vantage is "above" the Sun-Earth-target line, looking down at the
      // midpoint so all three are in view.
      const lineMid = earthPos.clone().add(targetPos).multiplyScalar(0.5);
      lookAt = lineMid;
      const targetOrbit = getSceneOrbitRadius(targetObj.body);
      const standoff = Math.max(8, targetOrbit * 0.6);
      // Side-step direction perpendicular to the line in the ecliptic plane.
      const lineDir = targetPos.clone().sub(earthPos).normalize();
      const sideDir = new THREE.Vector3(-lineDir.z, 0, lineDir.x).normalize();
      cameraPos = lineMid.clone()
        .add(sideDir.multiplyScalar(standoff))
        .add(new THREE.Vector3(0, standoff * 0.55, 0));
    }

    state.cameraAnim = {
      from: camera.position.clone(),
      fromTarget: controls.target.clone(),
      to: cameraPos,
      target: lookAt,
      t: 0,
      duration: 2.4,
    };
    controls.enabled = false;

    // After the fly-through, open the planet's info card.
    setTimeout(() => { if (bodyId) openDetail(bodyId); }, 2700);
  });
}

// ===================================================================
// AR SKY GUIDE — point your phone at the sky to find a planet
// ===================================================================
// Math: heliocentric scene position → geocentric vector → equatorial RA/Dec
// → topocentric altitude/azimuth using observer location and local sidereal
// time. We compare to device orientation (compass + tilt) to draw an arrow.

const AR_OBSERVER_DEFAULT = { lat: 41.3, lon: 69.25, name: 'Tashkent' };  // fallback if geolocation denied
let arState = {
  active: false,
  targetId: 'mars',
  observer: { ...AR_OBSERVER_DEFAULT },
  device: { alpha: null, beta: null, gamma: null },  // null = no data yet
};

function julianDay(ms) { return ms / 86400000 + 2440587.5; }
function gmstHours(ms) {
  // Meeus formula for Greenwich Mean Sidereal Time (good to ~1 arcsec).
  const JD = julianDay(ms);
  const T = (JD - 2451545.0) / 36525;
  let gmst = 280.46061837 + 360.98564736629 * (JD - 2451545.0)
           + 0.000387933 * T * T - (T*T*T) / 38710000;
  gmst = ((gmst % 360) + 360) % 360;
  return gmst / 15;  // hours
}

/** Heliocentric ecliptic scene coords (THREE-space x,y,z) → geocentric
 *  equatorial RA/Dec. In our convention y is the ecliptic-north axis. */
function bodyRaDec(bodyId, simMs) {
  const body  = BODIES.find(b => b.id === bodyId);
  const earth = BODIES.find(b => b.id === 'earth');
  if (!body) return null;
  // We want the direction from observer (Earth) to the body, in equatorial
  // coordinates. Our scene uses ecliptic; rotate by -23.4° about X to go
  // from ecliptic to equatorial.
  const pBody  = getBodyPosition(body,  simMs);
  const pEarth = (bodyId === 'earth') ? new THREE.Vector3() : getBodyPosition(earth, simMs);
  // For the Sun the "geocentric" vector is just (Sun - Earth) = -Earth pos.
  // For the Moon it's already a child of Earth in our system, so pBody is its
  // helio position. We always compute (body - earth) so it works either way.
  const dx = pBody.x - pEarth.x;
  const dyEcl = pBody.y - pEarth.y;
  const dzEcl = pBody.z - pEarth.z;
  // Scene-y is ecliptic north; scene-(x,z) is the ecliptic plane.
  // Convert to equatorial: rotate about x by +23.4° so ecliptic north tilts
  // toward equatorial pole.
  const eps = 23.4392911 * Math.PI / 180;
  const ce = Math.cos(eps), se = Math.sin(eps);
  // Ecliptic frame (x, y_ecl=ecliptic-north, -z=ecliptic-y in standard sense)
  // We treat scene coords as: X = vernal direction, Y = ecliptic north, Z = perpendicular.
  // Rotating about X axis by eps:
  const y_eq =  ce * dyEcl - se * (-dzEcl);
  const z_eq =  se * dyEcl + ce * (-dzEcl);
  const x_eq = dx;
  const ra  = Math.atan2(z_eq, x_eq);  // -π..π
  const dec = Math.atan2(y_eq, Math.sqrt(x_eq*x_eq + z_eq*z_eq));
  let raHours = (ra * 12 / Math.PI);
  if (raHours < 0) raHours += 24;
  return { ra: raHours, dec: dec * 180 / Math.PI };
}

/** RA/Dec → altitude/azimuth for the observer at the current moment. */
function raDecToAltAz(raHours, decDeg, observer, simMs) {
  const lst = gmstHours(simMs) + observer.lon / 15;          // hours
  let H = (lst - raHours) * 15;                              // degrees
  H = ((H + 180) % 360 + 360) % 360 - 180;                   // wrap to -180..180
  const Hrad   = H * Math.PI / 180;
  const decRad = decDeg * Math.PI / 180;
  const latRad = observer.lat * Math.PI / 180;
  const sinAlt = Math.sin(latRad) * Math.sin(decRad) + Math.cos(latRad) * Math.cos(decRad) * Math.cos(Hrad);
  const alt    = Math.asin(Math.max(-1, Math.min(1, sinAlt)));
  const y = -Math.cos(decRad) * Math.sin(Hrad);
  const x =  Math.sin(decRad) - Math.sin(alt) * Math.sin(latRad);
  let az = Math.atan2(y, x * Math.cos(latRad) / Math.cos(latRad));  // safer two-arg
  // Standard formula: az = atan2(sin(H), cos(H)*sin(lat) - tan(dec)*cos(lat))
  // measured from south, clockwise. Use that and convert to "from north CW".
  az = Math.atan2(Math.sin(Hrad), Math.cos(Hrad) * Math.sin(latRad) - Math.tan(decRad) * Math.cos(latRad));
  az = az * 180 / Math.PI + 180;                             // 0=N, 90=E, 180=S, 270=W
  az = ((az % 360) + 360) % 360;
  return { alt: alt * 180 / Math.PI, az };
}

function openArMode() {
  arState.active = true;
  arState.targetId = arState.targetId || 'mars';
  const overlay = document.getElementById('ar-overlay');
  const body    = document.getElementById('ar-body');
  if (!overlay || !body) return;

  const hasOrientation = 'ondeviceorientation' in window || 'ondeviceorientationabsolute' in window;

          body.querySelector('p').textContent = t('arNoSensor');
        }
      } catch (e) {
        body.querySelector('p').textContent = t('arNoSensor');
      }
    });

    showAndStart();
  }

  // Try to refine observer location to user's actual lat/lon.
  if ('geolocation' in navigator) {
    navigator.geolocation.getCurrentPosition(
      pos => { arState.observer = { lat: pos.coords.latitude, lon: pos.coords.longitude, name: 'You' }; },
      () => {},
      { maximumAge: 600000, timeout: 4000 },
    );
  }
}

function handleOrientation(e) {
  // alpha: compass-like rotation around vertical (0=N when device is flat).
  // beta:  front-to-back tilt (-180..180). 0 when flat face up.
  // gamma: left-to-right tilt (-90..90).
  // iOS exposes webkitCompassHeading (true north, clockwise from N) which
  // is more accurate; prefer it when available.
  let compass;
  if (typeof e.webkitCompassHeading === 'number') {
    compass = e.webkitCompassHeading;
  } else if (e.absolute && typeof e.alpha === 'number') {
    compass = (360 - e.alpha) % 360;
  } else if (typeof e.alpha === 'number') {
    compass = (360 - e.alpha) % 360;  // best effort; relative on Android
  }
  arState.device = { alpha: compass, beta: e.beta, gamma: e.gamma };
}
function startOrientation() {
  window.addEventListener('deviceorientationabsolute', handleOrientation);
  window.addEventListener('deviceorientation', handleOrientation);
}
function stopOrientation() {
  window.removeEventListener('deviceorientationabsolute', handleOrientation);
  window.removeEventListener('deviceorientation', handleOrientation);
}

function tickAr() {
  if (!arState.active) return;
  const arrow = document.getElementById('ar-arrow');
  const nameEl = document.getElementById('ar-target-name');
  const coordsEl = document.getElementById('ar-coords');
  if (!arrow || !nameEl || !coordsEl) return;

  const target = BODIES.find(b => b.id === arState.targetId);
  if (!target) return;
  nameEl.textContent = bodyText(target, 'name');

  const rd = bodyRaDec(arState.targetId, Date.now());
  if (!rd) return;
  const aa = raDecToAltAz(rd.ra, rd.dec, arState.observer, Date.now());

  // Phone "pointing" direction:
  // - device azimuth (from north, clockwise) = compass heading
  // - device altitude (above horizon) = 90 + beta when phone tilted up vertically
  //   (beta = -90 → phone face-up flat; beta = 0 → screen tilted vertical facing user;
  //    beta = 90 → phone face-down)
  const dev = arState.device;
  if (dev.alpha == null || dev.beta == null) {
    coordsEl.textContent = '—';
    return;
  }
  const deviceAz  = dev.alpha;
  const deviceAlt = 90 - Math.abs(dev.beta);  // crude but works when user holds phone roughly upright

  let dAz = aa.az - deviceAz;
  dAz = ((dAz + 540) % 360) - 180;            // -180..180, positive = right
  const dAlt = aa.alt - deviceAlt;            // positive = up

  const distance = Math.sqrt(dAz * dAz + dAlt * dAlt);
  const angle = Math.atan2(dAz, -dAlt) * 180 / Math.PI;  // arrow rotation (0 = up)

  arrow.style.transform = `rotate(${angle}deg)`;
  arrow.classList.toggle('locked', distance < 6);

  let hint = '';
  if (aa.alt < -2) {
    hint = `<span class="ar-below-horizon">${t('arBelowHorizon')}</span>`;
  } else if (distance < 6) {
    hint = `<span class="ar-locked-text">${t('arLocked')}</span>`;
  } else {
    const v = dAlt >= 0 ? t('arUp') : t('arDown');
    const h = dAz  >= 0 ? t('arRight') : t('arLeft');
    hint = `${Math.abs(dAlt).toFixed(0)}° ${v} · ${Math.abs(dAz).toFixed(0)}° ${h}`;
  }
  coordsEl.innerHTML = `${t('arAlt')}: ${aa.alt.toFixed(0)}° · ${t('arAz')}: ${aa.az.toFixed(0)}°<br>${hint}`;
}
setInterval(tickAr, 100);

  // Remove the previous click handler by cloning the node.
  const clone = _profileBtn.cloneNode(true);
  _profileBtn.parentNode.replaceChild(clone, _profileBtn);
  clone.addEventListener('click', () => { playClick(); haptic('light'); openProfileMenu(); });
}

function openProfileMenu() {
  const existing = document.getElementById('lang-sheet');
  if (existing) existing.remove();
  const oldBackdrop = document.getElementById('lang-backdrop');
  if (oldBackdrop) oldBackdrop.remove();

  const sheet = document.createElement('div');
  sheet.id = 'lang-sheet';
  sheet.className = 'glass';
  sheet.style.cssText = `
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
    z-index:120; min-width:280px; max-width:320px; padding:22px 20px 18px;
    border-radius:24px; display:flex; flex-direction:column; gap:12px;
  `;
  const langs = [
    { id: 'uz', label: 'UZ' },
    { id: 'ru', label: 'RU' },
    { id: 'en', label: 'EN' },
  ];
  const renderLangRow = () => langs.map(L => `
        <button class="lang-pill pill ${L.id === state.lang ? 'toggle-on' : 'toggle-off'}"
                data-lang="${L.id}"
                style="flex:1; padding:10px 0; font-size:14px; font-weight:600; letter-spacing:0.5px;">
          ${L.label}
        </button>`).join('');

  const backdrop = document.createElement('div');
  backdrop.id = 'lang-backdrop';
  backdrop.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:115;backdrop-filter:blur(4px);';
  const close = () => { sheet.remove(); backdrop.remove(); };
  backdrop.addEventListener('click', close);
  document.body.appendChild(backdrop);
  document.body.appendChild(sheet);

  // Re-render the entire sheet so every label — title, language row and the
  // Birthday button — reflects the current language. Earlier this only
  // refreshed the pills and the Birthday line, leaving the "Profil" title and
  // "Til" label stuck in the previous language after a switch.
  const renderSheet = () => {
    sheet.innerHTML = `
      <div style="font-size:14px; opacity:0.7;">${t('profile')}</div>
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; opacity:0.85;">
        <span style="font-size:16px;">🌐</span>
        <span>${t('profileLanguage')}</span>
      </div>
      <div id="profile-lang-row" style="display:flex; gap:8px;">
        ${renderLangRow()}
      </div>
      <button class="pill toggle-off" id="profile-bday"
              style="padding:14px 16px; font-size:15px; text-align:left; margin-top:4px;">
        🎂  ${t('profileBirthday')}
      </button>
    `;
    sheet.querySelectorAll('.lang-pill').forEach(b => {
      b.addEventListener('click', () => {
        playClick(); haptic('light');
        setLanguage(b.dataset.lang);
        renderSheet();  // refresh the whole menu in the new language
      });
    });
    sheet.querySelector('#profile-bday').addEventListener('click', () => {
      playClick(); haptic('light');
      close();
      openBirthday();
    });
  };
  renderSheet();
}

</script>
  </body>
</html>
